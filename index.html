<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporada — frutas y verduras de estación en Argentina</title>
<meta name="description" content="Qué frutas y verduras están de temporada en Argentina, mes a mes. / What produce is in season in Argentina, month by month.">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f8f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Temporada">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#grid-wrap" id="skiplbl">Skip to table</a>
<header>
  <div class="bar">
    <h1>Temporada</h1>
    <button id="settingsbtn" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙ </span><span id="settingslbl"></span></button>
  </div>
  <p id="tagline"></p>
</header>
<main>
<section class="controls" id="filters" aria-label="Filtros">
  <input id="q" type="search" autocomplete="off">
</section>
<p id="count" aria-live="polite"></p>
<div class="wrap" id="grid-wrap" role="region" tabindex="0">
  <table id="grid"></table>
</div>
</main>
<footer>
  <h2 id="srch"></h2>
  <ul id="sources"></ul>
  <p id="caveat"></p>
</footer>
<dialog id="settings" aria-labelledby="settingsttl">
  <h2 id="settingsttl"></h2>
  <div class="field"><span id="typelbl" class="flbl"></span>
    <div class="seg" role="group" id="type">
      <button type="button" data-v="all" aria-pressed="true"></button>
      <button type="button" data-v="veg" aria-pressed="false"></button>
      <button type="button" data-v="fruit" aria-pressed="false"></button>
    </div>
  </div>
  <div class="field"><label class="chk"><input id="now" type="checkbox"> <span id="nowlbl"></span></label></div>
  <div class="field"><span id="langlbl" class="flbl"></span>
    <div class="seg" role="group" id="langgrp">
      <button type="button" data-l="es" lang="es" aria-pressed="false">Español</button>
      <button type="button" data-l="en" lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <div class="field"><span id="themelbl" class="flbl"></span>
    <div class="seg" role="group" id="theme">
      <button type="button" data-t="system" aria-pressed="false"></button>
      <button type="button" data-t="light" aria-pressed="false"></button>
      <button type="button" data-t="dark" aria-pressed="false"></button>
    </div>
  </div>
  <div class="field"><span id="monthlbl" class="flbl"></span>
    <button id="rot" type="button"></button>
  </div>
  <button id="closebtn" type="button" class="primary"></button>
</dialog>
<script src="data/produce.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
</body>
</html>
